<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 20" width="900" height="20" role="img" aria-label="divider">
<defs>
<linearGradient id="dedge" x1="0" x2="1" y1="0" y2="0">
  <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
  <stop offset=".3" stop-color="#ff2bd6"/>
  <stop offset=".5" stop-color="#00f0ff"/>
  <stop offset=".7" stop-color="#ff2bd6"/>
  <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
</linearGradient>
<filter id="dglow" x="-20%" y="-50%" width="140%" height="200%">
  <feGaussianBlur stdDeviation="2" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>

<!-- Main divider line -->
<rect y="9" width="900" height="2" fill="url(#dedge)" opacity=".8"/>

<!-- Running light effect - forward -->
<rect y="9" width="120" height="2" fill="#00f0ff" opacity=".9" filter="url(#dglow)">
  <animate attributeName="x" values="-120;900" dur="2.5s" repeatCount="indefinite"/>
</rect>

<!-- Running light effect - backward (different color) -->
<rect y="9" width="80" height="2" fill="#ff2bd6" opacity=".7" filter="url(#dglow)">
  <animate attributeName="x" values="900;-80" dur="3s" repeatCount="indefinite"/>
</rect>

<!-- Center diamond -->
<rect x="440" y="5" width="10" height="10" rx="1" fill="#0a0a0a" stroke="#00f0ff" stroke-width="1" transform="rotate(45 445 10)">
  <animate attributeName="stroke" values="#00f0ff;#ff2bd6;#f0ff00;#00f0ff" dur="3s" repeatCount="indefinite"/>
</rect>

</svg>
