<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="900" height="140" role="img" aria-label="CONNECT AND PLAY">
<defs>
<linearGradient id="s3bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="140">
  <stop offset="0" stop-color="#0a0a0a"><animate attributeName="stop-color" values="#0a0a0a;#0d001a;#0a0a0a" dur="12s" repeatCount="indefinite"/></stop>
  <stop offset=".5" stop-color="#0d0030"><animate attributeName="stop-color" values="#0d0030;#1a0044;#0d0030" dur="10s" repeatCount="indefinite"/></stop>
  <stop offset="1" stop-color="#0a0a0a"/>
  <animateTransform attributeName="gradientTransform" type="rotate" values="0 450 70;5 450 70;0 450 70;-5 450 70;0 450 70" dur="14s" repeatCount="indefinite"/>
</linearGradient>
<pattern id="s3grid" width="30" height="30" patternUnits="userSpaceOnUse">
  <path d="M30 0H0V30" fill="none" stroke="#ff2bd6" stroke-opacity=".05"/>
</pattern>
<pattern id="s3scan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="1" fill="#000" opacity=".18"/>
  <animateTransform attributeName="patternTransform" type="translate" values="0 0;0 4" dur="2.5s" repeatCount="indefinite"/>
</pattern>
<linearGradient id="s3edge" x1="0" x2="1" y1="0" y2="0">
  <stop offset="0" stop-color="#ff2bd6" stop-opacity="0"/>
  <stop offset=".3" stop-color="#00f0ff"/>
  <stop offset=".5" stop-color="#ff00ff"/>
  <stop offset=".7" stop-color="#00f0ff"/>
  <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
</linearGradient>
<filter id="s3glow" x="-20%" y="-50%" width="140%" height="200%">
  <feGaussianBlur stdDeviation="5" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="s3glow2" x="-20%" y="-50%" width="140%" height="200%">
  <feGaussianBlur stdDeviation="2" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>

<!-- Background -->
<rect width="900" height="140" fill="url(#s3bg)"/>
<rect width="900" height="140" fill="url(#s3grid)"/>
<rect width="900" height="140" fill="url(#s3scan)"/>

<!-- Edge lines -->
<rect y="0" width="900" height="2" fill="url(#s3edge)"/>
<rect y="138" width="900" height="2" fill="url(#s3edge)"/>

<!-- Running borders -->
<rect y="0" width="100" height="2" fill="#ff00ff" opacity=".9" filter="url(#s3glow2)">
  <animate attributeName="x" values="-100;900" dur="3s" repeatCount="indefinite"/>
</rect>
<rect y="138" width="100" height="2" fill="#00f0ff" opacity=".9" filter="url(#s3glow2)">
  <animate attributeName="x" values="900;-100" dur="3.5s" repeatCount="indefinite"/>
</rect>

<!-- Corner brackets -->
<g fill="none" stroke="#ff2bd6" stroke-width="2" opacity=".7">
  <path d="M10 30V10H30"/><path d="M870 10H890V30"/>
  <path d="M10 110V130H30"/><path d="M870 130H890V110"/>
</g>

<!-- Section number -->
<text x="34" y="34" font-family="'Courier New',monospace" font-size="13" fill="#00f0ff" letter-spacing="3">[ 03 ]</text>

<!-- GLITCH TITLE: "CONNECT &amp; PLAY" -->
<text x="450" y="82" text-anchor="middle" font-family="'Courier New',monospace" font-weight="900" font-size="48" letter-spacing="5" fill="#00f0ff" opacity="0">
  <animate attributeName="opacity" values="0;0;.7;0;.7;0;.7;0" keyTimes="0;.84;.85;.87;.89;.91;.93;1" dur="4.5s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-6 0;4 1;-3 -1;5 0;-2 0;0 0" keyTimes="0;.84;.85;.87;.89;.91;.93;1" dur="4.5s" repeatCount="indefinite"/>
CONNECT &amp; PLAY</text>
<text x="450" y="82" text-anchor="middle" font-family="'Courier New',monospace" font-weight="900" font-size="48" letter-spacing="5" fill="#ff2bd6" opacity="0">
  <animate attributeName="opacity" values="0;0;.7;0;.7;0;.7;0" keyTimes="0;.84;.85;.87;.89;.91;.93;1" dur="4.5s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 0;6 1;-4 0;3 1;-5 0;2 0;0 0" keyTimes="0;.84;.85;.87;.89;.91;.93;1" dur="4.5s" repeatCount="indefinite"/>
CONNECT &amp; PLAY</text>
<text x="450" y="82" text-anchor="middle" font-family="'Courier New',monospace" font-weight="900" font-size="48" letter-spacing="5" fill="#ffffff" stroke="#ff2bd6" stroke-width=".4" filter="url(#s3glow)">
  <animate attributeName="opacity" values="1;1;.85;1;.9;1" keyTimes="0;.5;.51;.53;.55;1" dur="4.5s" repeatCount="indefinite"/>
CONNECT &amp; PLAY</text>

<!-- Glitch slice -->
<clipPath id="s3sl"><rect x="0" y="58" width="900" height="10"/></clipPath>
<g clip-path="url(#s3sl)">
  <text x="450" y="82" text-anchor="middle" font-family="'Courier New',monospace" font-weight="900" font-size="48" letter-spacing="5" fill="#f0ff00" opacity="0">
    <animate attributeName="opacity" values="0;0;.8;0;.8;0;0" keyTimes="0;.4;.41;.43;.45;.47;1" dur="4.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;12 0;-8 0;10 0;0 0;0 0" keyTimes="0;.4;.41;.43;.45;.47;1" dur="4.5s" repeatCount="indefinite"/>
  CONNECT &amp; PLAY</text>
</g>

<!-- Subtitle -->
<text x="450" y="116" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" fill="#ff2bd6" letter-spacing="4" opacity=".7">// SOCIAL MEDIA . CONTRIBUTION GAME</text>

</svg>
