<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="900" height="140" role="img" aria-label="TECH ARSENAL">
<defs>
<linearGradient id="s2bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="140">
  <stop offset="0" stop-color="#0a0a0a"><animate attributeName="stop-color" values="#0a0a0a;#0d001a;#0a0a0a" dur="12s" repeatCount="indefinite"/></stop>
  <stop offset=".5" stop-color="#0d0030"><animate attributeName="stop-color" values="#0d0030;#1a0044;#0d0030" dur="10s" repeatCount="indefinite"/></stop>
  <stop offset="1" stop-color="#0a0a0a"/>
  <animateTransform attributeName="gradientTransform" type="rotate" values="0 450 70;5 450 70;0 450 70;-5 450 70;0 450 70" dur="14s" repeatCount="indefinite"/>
</linearGradient>
<pattern id="s2grid" width="30" height="30" patternUnits="userSpaceOnUse">
  <path d="M30 0H0V30" fill="none" stroke="#00f0ff" stroke-opacity=".05"/>
</pattern>
<pattern id="s2scan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="1" fill="#000" opacity=".18"/>
  <animateTransform attributeName="patternTransform" type="translate" values="0 0;0 4" dur="2.5s" repeatCount="indefinite"/>
</pattern>
<linearGradient id="s2edge" x1="0" x2="1" y1="0" y2="0">
  <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
  <stop offset=".3" stop-color="#ff2bd6"/>
  <stop offset=".5" stop-color="#00f0ff"/>
  <stop offset=".7" stop-color="#ff2bd6"/>
  <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
</linearGradient>
<filter id="s2glow" x="-20%" y="-50%" width="140%" height="200%">
  <feGaussianBlur stdDeviation="5" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="s2glow2" x="-20%" y="-50%" width="140%" height="200%">
  <feGaussianBlur stdDeviation="2" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>

<!-- Background -->
<rect width="900" height="140" fill="url(#s2bg)"/>
<rect width="900" height="140" fill="url(#s2grid)"/>
<rect width="900" height="140" fill="url(#s2scan)"/>

<!-- Edge lines -->
<rect y="0" width="900" height="2" fill="url(#s2edge)"/>
<rect y="138" width="900" height="2" fill="url(#s2edge)"/>

<!-- Running borders -->
<rect y="0" width="100" height="2" fill="#00f0ff" opacity=".9" filter="url(#s2glow2)">
  <animate attributeName="x" values="-100;900" dur="3s" repeatCount="indefinite"/>
</rect>
<rect y="138" width="100" height="2" fill="#ff2bd6" opacity=".9" filter="url(#s2glow2)">
  <animate attributeName="x" values="900;-100" dur="3.5s" repeatCount="indefinite"/>
</rect>

<!-- Corner brackets -->
<g fill="none" stroke="#00f0ff" stroke-width="2" opacity=".7">
  <path d="M10 30V10H30"/><path d="M870 10H890V30"/>
  <path d="M10 110V130H30"/><path d="M870 130H890V110"/>
</g>

<!-- Section number -->
<text x="34" y="34" font-family="'Courier New',monospace" font-size="13" fill="#ff2bd6" letter-spacing="3">[ 02 ]</text>

<!-- ============ MATRIX RAIN - Dense falling code ============ -->
<g font-family="'Courier New',monospace" font-size="10" opacity=".18">
  <text x="70" fill="#00f0ff"><animate attributeName="y" values="-10;150" dur="3.5s" begin="0.2s" repeatCount="indefinite"/>npm</text>
  <text x="70" fill="#00f0ff"><animate attributeName="y" values="-10;150" dur="3.5s" begin="1.95s" repeatCount="indefinite"/>run</text>
  <text x="120" fill="#ff2bd6"><animate attributeName="y" values="-15;150" dur="4.0s" begin="0.5s" repeatCount="indefinite"/>pip</text>
  <text x="120" fill="#ff2bd6"><animate attributeName="y" values="-15;150" dur="4.0s" begin="2.5s" repeatCount="indefinite"/>apt</text>
  <text x="170" fill="#00f0ff"><animate attributeName="y" values="-12;150" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>git</text>
  <text x="170" fill="#00f0ff"><animate attributeName="y" values="-12;150" dur="3.2s" begin="2.0s" repeatCount="indefinite"/>add</text>
  <text x="220" fill="#f0ff00"><animate attributeName="y" values="-18;150" dur="4.5s" begin="1.2s" repeatCount="indefinite"/>php</text>
  <text x="270" fill="#ff00ff"><animate attributeName="y" values="-10;150" dur="3.8s" begin="0.3s" repeatCount="indefinite"/>def</text>
  <text x="270" fill="#ff00ff"><animate attributeName="y" values="-10;150" dur="3.8s" begin="2.2s" repeatCount="indefinite"/>try</text>
  <text x="320" fill="#00f0ff"><animate attributeName="y" values="-14;150" dur="3.0s" begin="1.0s" repeatCount="indefinite"/>yarn</text>
  <text x="320" fill="#00f0ff"><animate attributeName="y" values="-14;150" dur="3.0s" begin="2.3s" repeatCount="indefinite"/>dev</text>
  <text x="380" fill="#ff2bd6"><animate attributeName="y" values="-20;150" dur="4.3s" begin="0.7s" repeatCount="indefinite"/>bash</text>
  <text x="430" fill="#00f0ff"><animate attributeName="y" values="-8;150" dur="3.6s" begin="1.5s" repeatCount="indefinite"/>sudo</text>
  <text x="430" fill="#00f0ff"><animate attributeName="y" values="-8;150" dur="3.6s" begin="0.1s" repeatCount="indefinite"/>exec</text>
  <text x="480" fill="#f0ff00"><animate attributeName="y" values="-16;150" dur="4.8s" begin="2.0s" repeatCount="indefinite"/>0xFF</text>
  <text x="530" fill="#ff00ff"><animate attributeName="y" values="-12;150" dur="3.3s" begin="0.4s" repeatCount="indefinite"/>curl</text>
  <text x="530" fill="#ff00ff"><animate attributeName="y" values="-12;150" dur="3.3s" begin="2.0s" repeatCount="indefinite"/>wget</text>
  <text x="580" fill="#00f0ff"><animate attributeName="y" values="-18;150" dur="4.1s" begin="1.3s" repeatCount="indefinite"/>ssh@</text>
  <text x="630" fill="#ff2bd6"><animate attributeName="y" values="-10;150" dur="3.4s" begin="0.9s" repeatCount="indefinite"/>push</text>
  <text x="630" fill="#ff2bd6"><animate attributeName="y" values="-10;150" dur="3.4s" begin="2.6s" repeatCount="indefinite"/>pull</text>
  <text x="680" fill="#00f0ff"><animate attributeName="y" values="-14;150" dur="4.6s" begin="0.6s" repeatCount="indefinite"/>cat</text>
  <text x="730" fill="#f0ff00"><animate attributeName="y" values="-20;150" dur="3.7s" begin="1.8s" repeatCount="indefinite"/>grep</text>
  <text x="730" fill="#f0ff00"><animate attributeName="y" values="-20;150" dur="3.7s" begin="0.2s" repeatCount="indefinite"/>sed</text>
  <text x="780" fill="#ff00ff"><animate attributeName="y" values="-8;150" dur="3.1s" begin="1.1s" repeatCount="indefinite"/>nmap</text>
  <text x="830" fill="#00f0ff"><animate attributeName="y" values="-16;150" dur="4.4s" begin="0.5s" repeatCount="indefinite"/>echo</text>
  <text x="830" fill="#00f0ff"><animate attributeName="y" values="-16;150" dur="4.4s" begin="2.7s" repeatCount="indefinite"/>awk</text>
</g>

<!-- ============ TYPING CODE in background ============ -->
<g font-family="'Courier New',monospace" font-size="9" opacity=".1">
  <text x="30" y="125" fill="#00f0ff">
    <animate attributeName="opacity" values="0;0;.12;.12;.12;0" keyTimes="0;.05;.1;.6;.9;1" dur="8s" repeatCount="indefinite"/>
    $ composer require laravel/framework</text>
  <text x="500" y="30" fill="#ff2bd6">
    <animate attributeName="opacity" values="0;0;.1;.1;.1;0" keyTimes="0;.3;.35;.7;.9;1" dur="10s" repeatCount="indefinite"/>
    import numpy as np; model.fit(X_train)</text>
  <text x="50" y="55" fill="#f0ff00">
    <animate attributeName="opacity" values="0;0;.12;.12;.12;0" keyTimes="0;.15;.2;.55;.85;1" dur="9s" repeatCount="indefinite"/>
    npm install react-dom@latest --save</text>
  <text x="400" y="100" fill="#ff00ff">
    <animate attributeName="opacity" values="0;0;.1;.1;.1;0" keyTimes="0;.4;.45;.75;.9;1" dur="11s" repeatCount="indefinite"/>
    docker build -t myapp:v2 .</text>
  <text x="180" y="80" fill="#00f0ff">
    <animate attributeName="opacity" values="0;0;.12;.12;.12;0" keyTimes="0;.5;.55;.8;.95;1" dur="12s" repeatCount="indefinite"/>
    SELECT COUNT(*) FROM analytics;</text>
  <text x="600" y="60" fill="#ff2bd6">
    <animate attributeName="opacity" values="0;0;.1;.1;.1;0" keyTimes="0;.2;.25;.65;.85;1" dur="7s" repeatCount="indefinite"/>
    git push origin main --force</text>
</g>

<!-- GLITCH TITLE: "TECH ARSENAL" -->
<!-- Cyan glitch layer -->
<text x="450" y="82" text-anchor="middle" font-family="'Courier New',monospace" font-weight="900" font-size="48" letter-spacing="5" fill="#00f0ff" opacity="0">
  <animate attributeName="opacity" values="0;0;.7;0;.7;0;.7;0" keyTimes="0;.84;.85;.87;.89;.91;.93;1" dur="4.5s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-6 0;4 1;-3 -1;5 0;-2 0;0 0" keyTimes="0;.84;.85;.87;.89;.91;.93;1" dur="4.5s" repeatCount="indefinite"/>
TECH ARSENAL</text>

<!-- Magenta glitch layer -->
<text x="450" y="82" text-anchor="middle" font-family="'Courier New',monospace" font-weight="900" font-size="48" letter-spacing="5" fill="#ff2bd6" opacity="0">
  <animate attributeName="opacity" values="0;0;.7;0;.7;0;.7;0" keyTimes="0;.84;.85;.87;.89;.91;.93;1" dur="4.5s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 0;6 1;-4 0;3 1;-5 0;2 0;0 0" keyTimes="0;.84;.85;.87;.89;.91;.93;1" dur="4.5s" repeatCount="indefinite"/>
TECH ARSENAL</text>

<!-- Main title -->
<text x="450" y="82" text-anchor="middle" font-family="'Courier New',monospace" font-weight="900" font-size="48" letter-spacing="5" fill="#ffffff" stroke="#ff00ff" stroke-width=".4" filter="url(#s2glow)">
  <animate attributeName="opacity" values="1;1;.85;1;.9;1" keyTimes="0;.5;.51;.53;.55;1" dur="4.5s" repeatCount="indefinite"/>
TECH ARSENAL</text>

<!-- Glitch slice -->
<clipPath id="s2sl"><rect x="0" y="58" width="900" height="10"/></clipPath>
<g clip-path="url(#s2sl)">
  <text x="450" y="82" text-anchor="middle" font-family="'Courier New',monospace" font-weight="900" font-size="48" letter-spacing="5" fill="#f0ff00" opacity="0">
    <animate attributeName="opacity" values="0;0;.8;0;.8;0;0" keyTimes="0;.4;.41;.43;.45;.47;1" dur="4.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;12 0;-8 0;10 0;0 0;0 0" keyTimes="0;.4;.41;.43;.45;.47;1" dur="4.5s" repeatCount="indefinite"/>
  TECH ARSENAL</text>
</g>

<!-- Subtitle -->
<text x="450" y="116" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" fill="#00f0ff" letter-spacing="4" opacity=".7">// STACK . FRAMEWORK . TOOLS . PROJECTS</text>

</svg>
