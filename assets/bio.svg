<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Bio Feby Awie">
<defs>
<linearGradient id="bbg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="440">
  <stop offset="0" stop-color="#0a0a0a"><animate attributeName="stop-color" values="#0a0a0a;#0d001a;#0a0a0a" dur="12s" repeatCount="indefinite"/></stop>
  <stop offset=".4" stop-color="#0d0030"><animate attributeName="stop-color" values="#0d0030;#1a0044;#0d0030" dur="10s" repeatCount="indefinite"/></stop>
  <stop offset=".7" stop-color="#1a0044"><animate attributeName="stop-color" values="#1a0044;#2a0060;#1a0044" dur="14s" repeatCount="indefinite"/></stop>
  <stop offset="1" stop-color="#0a0a0a"/>
  <animateTransform attributeName="gradientTransform" type="rotate" values="0 450 220;6 450 220;0 450 220;-6 450 220;0 450 220" dur="16s" repeatCount="indefinite"/>
</linearGradient>
<pattern id="bgrid" width="30" height="30" patternUnits="userSpaceOnUse">
  <path d="M30 0H0V30" fill="none" stroke="#00f0ff" stroke-opacity=".04"/>
</pattern>
<pattern id="bscan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="1" fill="#000" opacity=".18"/>
  <animateTransform attributeName="patternTransform" type="translate" values="0 0;0 4" dur="2.5s" repeatCount="indefinite"/>
</pattern>
<linearGradient id="bedge" x1="0" x2="1" y1="0" y2="0">
  <stop offset="0" stop-color="#ff00ff" stop-opacity="0"/>
  <stop offset=".5" stop-color="#00f0ff"/>
  <stop offset="1" stop-color="#ff00ff" stop-opacity="0"/>
</linearGradient>
<filter id="bglow2" x="-20%" y="-50%" width="140%" height="200%">
  <feGaussianBlur stdDeviation="1.5" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>

<!-- Terminal window -->
<rect x="10" y="10" width="880" height="420" rx="12" fill="url(#bbg)"/>
<rect x="10" y="10" width="880" height="420" rx="12" fill="url(#bgrid)"/>
<rect x="10" y="10" width="880" height="420" rx="12" fill="url(#bscan)"/>

<!-- Terminal border with animated glow -->
<rect x="10" y="10" width="880" height="420" rx="12" fill="none" stroke="#00f0ff" stroke-width="1.5">
  <animate attributeName="stroke" values="#00f0ff;#ff2bd6;#f0ff00;#00f0ff" dur="6s" repeatCount="indefinite"/>
</rect>

<!-- Running border on terminal -->
<clipPath id="bclip"><rect x="10" y="10" width="880" height="420" rx="12"/></clipPath>
<g clip-path="url(#bclip)">
  <rect x="-80" y="10" width="80" height="2" fill="#00f0ff" opacity=".9" filter="url(#bglow2)">
    <animate attributeName="x" values="-80;900" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="900" y="428" width="80" height="2" fill="#ff2bd6" opacity=".9" filter="url(#bglow2)">
    <animate attributeName="x" values="900;-80" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- ============ MATRIX RAIN - Dense falling code inside terminal ============ -->
  <g font-family="'Courier New',monospace" font-size="10" opacity=".15">
    <text x="30" fill="#00f0ff"><animate attributeName="y" values="-10;450" dur="4.5s" begin="0.2s" repeatCount="indefinite"/>ssh</text>
    <text x="30" fill="#00f0ff"><animate attributeName="y" values="-10;450" dur="4.5s" begin="2.5s" repeatCount="indefinite"/>tcp</text>
    <text x="80" fill="#ff2bd6"><animate attributeName="y" values="-15;450" dur="5.2s" begin="0.6s" repeatCount="indefinite"/>curl</text>
    <text x="80" fill="#ff2bd6"><animate attributeName="y" values="-15;450" dur="5.2s" begin="3.2s" repeatCount="indefinite"/>wget</text>
    <text x="130" fill="#00f0ff"><animate attributeName="y" values="-12;450" dur="4.0s" begin="1.0s" repeatCount="indefinite"/>0xAF</text>
    <text x="130" fill="#00f0ff"><animate attributeName="y" values="-12;450" dur="4.0s" begin="3.0s" repeatCount="indefinite"/>0xC3</text>
    <text x="180" fill="#f0ff00"><animate attributeName="y" values="-18;450" dur="5.8s" begin="1.5s" repeatCount="indefinite"/>npm</text>
    <text x="230" fill="#ff00ff"><animate attributeName="y" values="-8;450" dur="4.3s" begin="0.4s" repeatCount="indefinite"/>git</text>
    <text x="230" fill="#ff00ff"><animate attributeName="y" values="-8;450" dur="4.3s" begin="2.5s" repeatCount="indefinite"/>add</text>
    <text x="290" fill="#00f0ff"><animate attributeName="y" values="-14;450" dur="5.0s" begin="1.2s" repeatCount="indefinite"/>pip3</text>
    <text x="340" fill="#ff2bd6"><animate attributeName="y" values="-20;450" dur="4.7s" begin="0.8s" repeatCount="indefinite"/>bash</text>
    <text x="340" fill="#ff2bd6"><animate attributeName="y" values="-20;450" dur="4.7s" begin="3.1s" repeatCount="indefinite"/>exec</text>
    <text x="400" fill="#00f0ff"><animate attributeName="y" values="-10;450" dur="4.1s" begin="1.8s" repeatCount="indefinite"/>sudo</text>
    <text x="450" fill="#f0ff00"><animate attributeName="y" values="-16;450" dur="5.5s" begin="0.3s" repeatCount="indefinite"/>chmod</text>
    <text x="500" fill="#ff00ff"><animate attributeName="y" values="-12;450" dur="4.4s" begin="0.9s" repeatCount="indefinite"/>def()</text>
    <text x="500" fill="#ff00ff"><animate attributeName="y" values="-12;450" dur="4.4s" begin="3.0s" repeatCount="indefinite"/>cls</text>
    <text x="560" fill="#00f0ff"><animate attributeName="y" values="-18;450" dur="4.8s" begin="1.4s" repeatCount="indefinite"/>yarn</text>
    <text x="610" fill="#ff2bd6"><animate attributeName="y" values="-8;450" dur="4.2s" begin="0.5s" repeatCount="indefinite"/>nmap</text>
    <text x="610" fill="#ff2bd6"><animate attributeName="y" values="-8;450" dur="4.2s" begin="2.6s" repeatCount="indefinite"/>scan</text>
    <text x="660" fill="#00f0ff"><animate attributeName="y" values="-14;450" dur="5.3s" begin="1.7s" repeatCount="indefinite"/>grep</text>
    <text x="720" fill="#f0ff00"><animate attributeName="y" values="-20;450" dur="4.6s" begin="0.7s" repeatCount="indefinite"/>cat</text>
    <text x="720" fill="#f0ff00"><animate attributeName="y" values="-20;450" dur="4.6s" begin="2.8s" repeatCount="indefinite"/>echo</text>
    <text x="770" fill="#ff00ff"><animate attributeName="y" values="-10;450" dur="4.9s" begin="1.1s" repeatCount="indefinite"/>awk</text>
    <text x="820" fill="#00f0ff"><animate attributeName="y" values="-16;450" dur="4.3s" begin="0.6s" repeatCount="indefinite"/>sed</text>
    <text x="820" fill="#00f0ff"><animate attributeName="y" values="-16;450" dur="4.3s" begin="2.9s" repeatCount="indefinite"/>tar</text>
    <text x="860" fill="#ff2bd6"><animate attributeName="y" values="-12;450" dur="5.1s" begin="1.3s" repeatCount="indefinite"/>php</text>
  </g>

  <!-- ============ TYPING CODE in background ============ -->
  <g font-family="'Courier New',monospace" font-size="9" opacity=".08">
    <text x="40" y="420" fill="#00f0ff">
      <animate attributeName="opacity" values="0;0;.1;.1;.1;0" keyTimes="0;.05;.1;.6;.9;1" dur="8s" repeatCount="indefinite"/>
      $ python3 -c "import sklearn; model.predict(X)"</text>
    <text x="450" y="60" fill="#ff2bd6">
      <animate attributeName="opacity" values="0;0;.08;.08;.08;0" keyTimes="0;.3;.35;.7;.9;1" dur="10s" repeatCount="indefinite"/>
      docker compose up -d --build nginx</text>
    <text x="30" y="200" fill="#f0ff00">
      <animate attributeName="opacity" values="0;0;.1;.1;.1;0" keyTimes="0;.15;.2;.55;.85;1" dur="9s" repeatCount="indefinite"/>
      npm install express cors dotenv</text>
    <text x="500" y="350" fill="#ff00ff">
      <animate attributeName="opacity" values="0;0;.08;.08;.08;0" keyTimes="0;.4;.45;.75;.9;1" dur="11s" repeatCount="indefinite"/>
      SELECT * FROM devs WHERE passion=100;</text>
    <text x="200" y="300" fill="#00f0ff">
      <animate attributeName="opacity" values="0;0;.1;.1;.1;0" keyTimes="0;.5;.55;.8;.95;1" dur="12s" repeatCount="indefinite"/>
      git rebase -i HEAD~5 --autosquash</text>
    <text x="550" y="160" fill="#ff2bd6">
      <animate attributeName="opacity" values="0;0;.08;.08;.08;0" keyTimes="0;.2;.25;.65;.85;1" dur="7s" repeatCount="indefinite"/>
      curl -X POST api/v1/deploy --data '{}'</text>
  </g>
</g>

<!-- Title bar -->
<rect x="10" y="10" width="880" height="38" rx="12" fill="#0d0d0d" fill-opacity=".8"/>
<rect x="10" y="36" width="880" height="12" fill="#0d0d0d" fill-opacity=".8"/>

<!-- Traffic lights -->
<circle cx="38" cy="29" r="6" fill="#ff0040"/><circle cx="58" cy="29" r="6" fill="#f0ff00"/><circle cx="78" cy="29" r="6" fill="#00ff41"/>

<!-- Title bar text -->
<text x="450" y="34" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" fill="#00f0ff" letter-spacing="2">febywi@github:~/biodata</text>
<text x="866" y="34" text-anchor="end" font-family="'Courier New',monospace" font-size="11" fill="#ff0040">
  <animate attributeName="opacity" values="1;.3;1" dur="1.5s" repeatCount="indefinite"/>● LIVE</text>

<!-- Terminal content - typing animation line by line -->
<!-- Line 1: whoami -->
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.5s" fill="freeze"/>
  <text x="48" y="85" font-family="'Courier New',monospace" font-size="16" font-weight="700" fill="#ff2bd6">$</text>
  <text x="68" y="85" font-family="'Courier New',monospace" font-size="16" fill="#00f0ff" xml:space="preserve">whoami</text>
</g>

<!-- Line 2: result -->
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.0s" fill="freeze"/>
  <text x="48" y="113" font-family="'Courier New',monospace" font-size="16" font-weight="700" fill="#ff00ff">&gt;</text>
  <text x="68" y="113" font-family="'Courier New',monospace" font-size="16" fill="#ffffff" xml:space="preserve">Feby Awie  //  @Febywi</text>
</g>

<!-- Line 3: cat command -->
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.5s" fill="freeze"/>
  <text x="48" y="148" font-family="'Courier New',monospace" font-size="16" font-weight="700" fill="#ff2bd6">$</text>
  <text x="68" y="148" font-family="'Courier New',monospace" font-size="16" fill="#00f0ff" xml:space="preserve">cat about_me.txt</text>
</g>

<!-- Line 4: origin -->
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.0s" fill="freeze"/>
  <text x="48" y="180" font-family="'Courier New',monospace" font-size="16" font-weight="700" fill="#ff00ff">&gt;</text>
  <text x="68" y="180" font-family="'Courier New',monospace" font-size="16" fill="#f0ff00" xml:space="preserve">📍 I'm from Indonesia.</text>
</g>

<!-- Line 5: education -->
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.5s" fill="freeze"/>
  <text x="48" y="208" font-family="'Courier New',monospace" font-size="16" font-weight="700" fill="#ff00ff">&gt;</text>
  <text x="68" y="208" font-family="'Courier New',monospace" font-size="16" fill="#f0ff00" xml:space="preserve">🎓 Informatics Management Graduate.</text>
</g>

<!-- Line 6: role part 1 -->
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="3.0s" fill="freeze"/>
  <text x="48" y="236" font-family="'Courier New',monospace" font-size="16" font-weight="700" fill="#ff00ff">&gt;</text>
  <text x="68" y="236" font-family="'Courier New',monospace" font-size="16" fill="#f0ff00" xml:space="preserve">💻 Web Developer &amp; Data Scientist who loves</text>
</g>

<!-- Line 7: role part 2 -->
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="3.5s" fill="freeze"/>
  <text x="68" y="264" font-family="'Courier New',monospace" font-size="16" fill="#f0ff00" xml:space="preserve">   building modern web apps, turning data into</text>
</g>

<!-- Line 8: role part 3 -->
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="4.0s" fill="freeze"/>
  <text x="68" y="292" font-family="'Courier New',monospace" font-size="16" fill="#f0ff00" xml:space="preserve">   insights, and automating systems.</text>
</g>

<!-- Blinking cursor -->
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="4.5s" fill="freeze"/>
  <text x="48" y="324" font-family="'Courier New',monospace" font-size="16" font-weight="700" fill="#ff2bd6">$</text>
  <rect x="68" y="310" width="10" height="18" fill="#00f0ff">
    <animate attributeName="opacity" values="1;0" keyTimes="0;.5" calcMode="discrete" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- Separator line -->
<rect x="40" y="348" width="820" height="1" fill="url(#bedge)" opacity=".5"/>

<!-- Role tags -->
<g>
  <!-- Tag 1: WEB DEVELOPER -->
  <rect x="48" y="368" width="152" height="30" rx="6" fill="#0d001a" stroke="#00f0ff" stroke-opacity=".8">
    <animate attributeName="stroke" values="#00f0ff;#ff2bd6;#00f0ff" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="124" y="388" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" font-weight="700" fill="#00f0ff" letter-spacing="1">WEB DEVELOPER</text>

  <!-- Tag 2: DATA SCIENTIST -->
  <rect x="212" y="368" width="162" height="30" rx="6" fill="#0d001a" stroke="#ff2bd6" stroke-opacity=".8">
    <animate attributeName="stroke" values="#ff2bd6;#00f0ff;#ff2bd6" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="293" y="388" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" font-weight="700" fill="#ff2bd6" letter-spacing="1">DATA SCIENTIST</text>

  <!-- Tag 3: FULLSTACK EXPLORER -->
  <rect x="386" y="368" width="190" height="30" rx="6" fill="#0d001a" stroke="#f0ff00" stroke-opacity=".8">
    <animate attributeName="stroke" values="#f0ff00;#ff00ff;#f0ff00" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="481" y="388" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" font-weight="700" fill="#f0ff00" letter-spacing="1">FULLSTACK EXPLORER</text>

  <!-- Tag 4: AUTOMATION LOVER -->
  <rect x="588" y="368" width="180" height="30" rx="6" fill="#0d001a" stroke="#ff00ff" stroke-opacity=".8">
    <animate attributeName="stroke" values="#ff00ff;#f0ff00;#ff00ff" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="678" y="388" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" font-weight="700" fill="#ff00ff" letter-spacing="1">AUTOMATION LOVER</text>
</g>

</svg>
