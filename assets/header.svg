<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Feby Awie - Cyberpunk Header">
<defs>
<linearGradient id="hbg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="280">
  <stop offset="0" stop-color="#0a0a0a"><animate attributeName="stop-color" values="#0a0a0a;#0d001a;#0a0a0a" dur="12s" repeatCount="indefinite"/></stop>
  <stop offset=".35" stop-color="#0d0030"><animate attributeName="stop-color" values="#0d0030;#1a0044;#0d0030" dur="10s" repeatCount="indefinite"/></stop>
  <stop offset=".65" stop-color="#1a0044"><animate attributeName="stop-color" values="#1a0044;#2a0060;#0d0030;#1a0044" dur="14s" repeatCount="indefinite"/></stop>
  <stop offset="1" stop-color="#0a0a0a"/>
  <animateTransform attributeName="gradientTransform" type="rotate" values="0 450 140;10 450 140;0 450 140;-10 450 140;0 450 140" dur="20s" repeatCount="indefinite"/>
</linearGradient>
<pattern id="hgrid" width="30" height="30" patternUnits="userSpaceOnUse">
  <path d="M30 0H0V30" fill="none" stroke="#00f0ff" stroke-opacity=".06"/>
</pattern>
<pattern id="hscan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="1" fill="#000" opacity=".2"/>
  <animateTransform attributeName="patternTransform" type="translate" values="0 0;0 4" dur="2.5s" repeatCount="indefinite"/>
</pattern>
<linearGradient id="hedge" x1="0" x2="1" y1="0" y2="0">
  <stop offset="0" stop-color="#ff00ff" stop-opacity="0"/>
  <stop offset=".3" stop-color="#00f0ff"/>
  <stop offset=".5" stop-color="#ff2bd6"/>
  <stop offset=".7" stop-color="#00f0ff"/>
  <stop offset="1" stop-color="#ff00ff" stop-opacity="0"/>
</linearGradient>
<filter id="hglow" x="-20%" y="-50%" width="140%" height="200%">
  <feGaussianBlur stdDeviation="5" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="hglow2" x="-20%" y="-50%" width="140%" height="200%">
  <feGaussianBlur stdDeviation="2" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>

<!-- Background layers -->
<rect width="900" height="280" fill="url(#hbg)"/>
<rect width="900" height="280" fill="url(#hgrid)"/>
<rect width="900" height="280" fill="url(#hscan)"/>

<!-- ============ MATRIX RAIN - Falling code (dense) ============ -->
<g font-family="'Courier New',monospace" font-size="10" opacity=".25">
  <!-- Column 1 -->
  <text x="15" fill="#00f0ff"><animate attributeName="y" values="-20;300" dur="3.5s" repeatCount="indefinite"/>sudo</text>
  <text x="15" fill="#00f0ff"><animate attributeName="y" values="-20;300" dur="3.5s" begin="1.75s" repeatCount="indefinite"/>nmap</text>
  <!-- Column 2 -->
  <text x="55" fill="#ff2bd6"><animate attributeName="y" values="-30;300" dur="4.2s" begin="0.3s" repeatCount="indefinite"/>#!/bin</text>
  <text x="55" fill="#ff2bd6"><animate attributeName="y" values="-30;300" dur="4.2s" begin="2.4s" repeatCount="indefinite"/>curl</text>
  <!-- Column 3 -->
  <text x="100" fill="#00f0ff"><animate attributeName="y" values="-15;300" dur="3.1s" begin="0.8s" repeatCount="indefinite"/>0xF4</text>
  <text x="100" fill="#00f0ff"><animate attributeName="y" values="-15;300" dur="3.1s" begin="2.3s" repeatCount="indefinite"/>0xAB</text>
  <!-- Column 4 -->
  <text x="145" fill="#ff00ff"><animate attributeName="y" values="-25;300" dur="5.0s" begin="1.2s" repeatCount="indefinite"/>wget</text>
  <!-- Column 5 -->
  <text x="190" fill="#00f0ff"><animate attributeName="y" values="-10;300" dur="3.8s" begin="0.5s" repeatCount="indefinite"/>ssh@</text>
  <text x="190" fill="#00f0ff"><animate attributeName="y" values="-10;300" dur="3.8s" begin="2.4s" repeatCount="indefinite"/>root</text>
  <!-- Column 6 -->
  <text x="235" fill="#f0ff00"><animate attributeName="y" values="-20;300" dur="4.5s" begin="1.8s" repeatCount="indefinite"/>pip3</text>
  <!-- Column 7 -->
  <text x="280" fill="#00f0ff"><animate attributeName="y" values="-30;300" dur="3.3s" begin="0.2s" repeatCount="indefinite"/>exec</text>
  <text x="280" fill="#00f0ff"><animate attributeName="y" values="-30;300" dur="3.3s" begin="1.85s" repeatCount="indefinite"/>kill</text>
  <!-- Column 8 -->
  <text x="325" fill="#ff2bd6"><animate attributeName="y" values="-18;300" dur="4.8s" begin="2.1s" repeatCount="indefinite"/>def()</text>
  <!-- Column 9 -->
  <text x="370" fill="#00f0ff"><animate attributeName="y" values="-22;300" dur="3.6s" begin="0.7s" repeatCount="indefinite"/>npm i</text>
  <text x="370" fill="#00f0ff"><animate attributeName="y" values="-22;300" dur="3.6s" begin="2.5s" repeatCount="indefinite"/>yarn</text>
  <!-- Column 10 -->
  <text x="415" fill="#ff00ff"><animate attributeName="y" values="-28;300" dur="4.1s" begin="1.5s" repeatCount="indefinite"/>class</text>
  <!-- Column 11 -->
  <text x="460" fill="#00f0ff"><animate attributeName="y" values="-12;300" dur="3.4s" begin="0.4s" repeatCount="indefinite"/>$_GET</text>
  <text x="460" fill="#00f0ff"><animate attributeName="y" values="-12;300" dur="3.4s" begin="2.1s" repeatCount="indefinite"/>$_POST</text>
  <!-- Column 12 -->
  <text x="510" fill="#f0ff00"><animate attributeName="y" values="-25;300" dur="5.2s" begin="1.0s" repeatCount="indefinite"/>0xFF</text>
  <!-- Column 13 -->
  <text x="555" fill="#00f0ff"><animate attributeName="y" values="-20;300" dur="3.7s" begin="2.0s" repeatCount="indefinite"/>git</text>
  <text x="555" fill="#00f0ff"><animate attributeName="y" values="-20;300" dur="3.7s" begin="0.2s" repeatCount="indefinite"/>push</text>
  <!-- Column 14 -->
  <text x="600" fill="#ff2bd6"><animate attributeName="y" values="-15;300" dur="4.4s" begin="0.9s" repeatCount="indefinite"/>apt</text>
  <!-- Column 15 -->
  <text x="645" fill="#00f0ff"><animate attributeName="y" values="-30;300" dur="3.2s" begin="1.3s" repeatCount="indefinite"/>chmod</text>
  <text x="645" fill="#00f0ff"><animate attributeName="y" values="-30;300" dur="3.2s" begin="2.9s" repeatCount="indefinite"/>grep</text>
  <!-- Column 16 -->
  <text x="695" fill="#ff00ff"><animate attributeName="y" values="-18;300" dur="4.7s" begin="0.6s" repeatCount="indefinite"/>ls -la</text>
  <!-- Column 17 -->
  <text x="740" fill="#00f0ff"><animate attributeName="y" values="-22;300" dur="3.9s" begin="1.7s" repeatCount="indefinite"/>cat</text>
  <text x="740" fill="#00f0ff"><animate attributeName="y" values="-22;300" dur="3.9s" begin="0.1s" repeatCount="indefinite"/>echo</text>
  <!-- Column 18 -->
  <text x="785" fill="#f0ff00"><animate attributeName="y" values="-28;300" dur="4.3s" begin="2.3s" repeatCount="indefinite"/>awk</text>
  <!-- Column 19 -->
  <text x="830" fill="#00f0ff"><animate attributeName="y" values="-14;300" dur="3.0s" begin="0.8s" repeatCount="indefinite"/>sed</text>
  <text x="830" fill="#00f0ff"><animate attributeName="y" values="-14;300" dur="3.0s" begin="1.5s" repeatCount="indefinite"/>tar</text>
  <!-- Column 20 -->
  <text x="870" fill="#ff2bd6"><animate attributeName="y" values="-20;300" dur="4.6s" begin="1.1s" repeatCount="indefinite"/>ping</text>
</g>

<!-- ============ TYPING CODE in background ============ -->
<g font-family="'Courier New',monospace" font-size="10" opacity=".12">
  <!-- Typing line 1: appears then disappears -->
  <text x="30" y="265" fill="#00f0ff">
    <animate attributeName="opacity" values="0;0;.15;.15;.15;0" keyTimes="0;.05;.1;.6;.9;1" dur="8s" repeatCount="indefinite"/>
    $ nmap -sV 192.168.1.0/24 --script vuln</text>
  <!-- Typing line 2 -->
  <text x="500" y="50" fill="#ff2bd6">
    <animate attributeName="opacity" values="0;0;.12;.12;.12;0" keyTimes="0;.3;.35;.7;.9;1" dur="10s" repeatCount="indefinite"/>
    import tensorflow as tf</text>
  <!-- Typing line 3 -->
  <text x="30" y="170" fill="#f0ff00">
    <animate attributeName="opacity" values="0;0;.1;.1;.1;0" keyTimes="0;.5;.55;.8;.95;1" dur="12s" repeatCount="indefinite"/>
    docker run -d --name app -p 80:80 nginx</text>
  <!-- Typing line 4 -->
  <text x="550" y="240" fill="#00f0ff">
    <animate attributeName="opacity" values="0;0;.12;.12;.12;0" keyTimes="0;.15;.2;.55;.85;1" dur="9s" repeatCount="indefinite"/>
    git commit -m "init exploit"</text>
  <!-- Typing line 5 -->
  <text x="200" y="80" fill="#ff00ff">
    <animate attributeName="opacity" values="0;0;.1;.1;.1;0" keyTimes="0;.4;.45;.75;.9;1" dur="11s" repeatCount="indefinite"/>
    SELECT * FROM users WHERE admin=1;</text>
</g>

<!-- Perspective grid floor -->
<g stroke="#00f0ff" stroke-opacity=".12" stroke-width="1">
  <line x1="450" y1="185" x2="-200" y2="280"/><line x1="450" y1="185" x2="-50" y2="280"/>
  <line x1="450" y1="185" x2="100" y2="280"/><line x1="450" y1="185" x2="250" y2="280"/>
  <line x1="450" y1="185" x2="450" y2="280"/><line x1="450" y1="185" x2="650" y2="280"/>
  <line x1="450" y1="185" x2="800" y2="280"/><line x1="450" y1="185" x2="950" y2="280"/>
  <line x1="450" y1="185" x2="1100" y2="280"/>
  <line x1="0" y1="185" x2="900" y2="185"/><line x1="0" y1="200" x2="900" y2="200"/>
  <line x1="0" y1="220" x2="900" y2="220"/><line x1="0" y1="245" x2="900" y2="245"/>
</g>
<rect y="184" width="900" height="2" fill="url(#hedge)" opacity=".7"/>

<!-- Corner brackets (HUD) -->
<g fill="none" stroke="#00f0ff" stroke-width="2" opacity=".8">
  <path d="M14 40V14H40"/><path d="M860 14H886V40"/>
  <path d="M14 240V266H40"/><path d="M860 266H886V240"/>
</g>
<circle cx="14" cy="14" r="3" fill="#ff2bd6"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="886" cy="14" r="3" fill="#00f0ff"><animate attributeName="opacity" values="1;.2;1" dur="2.3s" repeatCount="indefinite"/></circle>
<circle cx="14" cy="266" r="3" fill="#f0ff00"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
<circle cx="886" cy="266" r="3" fill="#ff00ff"><animate attributeName="opacity" values="1;.2;1" dur="2.5s" repeatCount="indefinite"/></circle>

<!-- Top bar -->
<text x="34" y="40" font-family="'Courier New',monospace" font-size="12" fill="#00f0ff" letter-spacing="2">// FEBYWI@GITHUB :: SESSION 0x4F2B</text>
<g font-family="'Courier New',monospace" font-size="12" fill="#ff2bd6" letter-spacing="2" text-anchor="end">
  <circle cx="730" cy="36" r="4" fill="#ff0040"><animate attributeName="opacity" values="1;.15;1" dur="1.2s" repeatCount="indefinite"/></circle>
  <text x="866" y="40">SYSTEM ONLINE</text>
</g>

<!-- Running borders -->
<rect y="0" width="100" height="2" fill="#00f0ff" opacity=".8" filter="url(#hglow2)">
  <animate attributeName="x" values="-100;900" dur="3s" repeatCount="indefinite"/>
</rect>
<rect y="278" width="100" height="2" fill="#ff2bd6" opacity=".8" filter="url(#hglow2)">
  <animate attributeName="x" values="900;-100" dur="3.5s" repeatCount="indefinite"/>
</rect>
<rect x="0" y="0" width="2" height="60" fill="#ff00ff" opacity=".6" filter="url(#hglow2)">
  <animate attributeName="y" values="-60;280" dur="4s" repeatCount="indefinite"/>
</rect>
<rect x="898" y="0" width="2" height="60" fill="#00f0ff" opacity=".6" filter="url(#hglow2)">
  <animate attributeName="y" values="280;-60" dur="4.5s" repeatCount="indefinite"/>
</rect>

<!-- GLITCH TEXT -->
<text x="450" y="135" text-anchor="middle" font-family="'Courier New',monospace" font-weight="900" font-size="80" letter-spacing="8" fill="#00f0ff" opacity="0">
  <animate attributeName="opacity" values="0;0;.7;0;.7;0;.7;0" keyTimes="0;.84;.85;.87;.89;.91;.93;1" dur="4.5s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-8 0;6 2;-5 -1;7 0;-3 0;0 0" keyTimes="0;.84;.85;.87;.89;.91;.93;1" dur="4.5s" repeatCount="indefinite"/>
FEBY AWIE</text>
<text x="450" y="135" text-anchor="middle" font-family="'Courier New',monospace" font-weight="900" font-size="80" letter-spacing="8" fill="#ff2bd6" opacity="0">
  <animate attributeName="opacity" values="0;0;.7;0;.7;0;.7;0" keyTimes="0;.84;.85;.87;.89;.91;.93;1" dur="4.5s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 0;8 1;-6 0;5 1;-7 0;3 0;0 0" keyTimes="0;.84;.85;.87;.89;.91;.93;1" dur="4.5s" repeatCount="indefinite"/>
FEBY AWIE</text>
<text x="450" y="135" text-anchor="middle" font-family="'Courier New',monospace" font-weight="900" font-size="80" letter-spacing="8" fill="#ffffff" stroke="#ff00ff" stroke-width=".5" filter="url(#hglow)">
  <animate attributeName="opacity" values="1;1;.85;1;.9;1" keyTimes="0;.5;.51;.53;.55;1" dur="4.5s" repeatCount="indefinite"/>
FEBY AWIE</text>

<!-- Glitch slices -->
<clipPath id="hsl1"><rect x="0" y="90" width="900" height="15"/></clipPath>
<g clip-path="url(#hsl1)">
  <text x="450" y="135" text-anchor="middle" font-family="'Courier New',monospace" font-weight="900" font-size="80" letter-spacing="8" fill="#f0ff00" opacity="0">
    <animate attributeName="opacity" values="0;0;.8;0;.8;0;0" keyTimes="0;.4;.41;.43;.45;.47;1" dur="4.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;16 0;-12 0;14 0;0 0;0 0" keyTimes="0;.4;.41;.43;.45;.47;1" dur="4.5s" repeatCount="indefinite"/>
  FEBY AWIE</text>
</g>
<clipPath id="hsl2"><rect x="0" y="120" width="900" height="10"/></clipPath>
<g clip-path="url(#hsl2)">
  <text x="450" y="135" text-anchor="middle" font-family="'Courier New',monospace" font-weight="900" font-size="80" letter-spacing="8" fill="#ff0040" opacity="0">
    <animate attributeName="opacity" values="0;0;.8;0;.8;0;0" keyTimes="0;.4;.41;.43;.45;.47;1" dur="4.5s" begin="1.2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-18 0;14 0;-10 0;0 0;0 0" keyTimes="0;.4;.41;.43;.45;.47;1" dur="4.5s" begin="1.2s" repeatCount="indefinite"/>
  FEBY AWIE</text>
</g>

<!-- Subtitle -->
<text x="450" y="225" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" fill="#00f0ff" letter-spacing="6" filter="url(#hglow2)">[ INITIALIZING PROFILE.EXE ]</text>

<!-- Loading bar -->
<rect x="270" y="242" width="360" height="4" rx="2" fill="#1a0044" stroke="#00f0ff" stroke-opacity=".3"/>
<rect x="270" y="242" width="0" height="4" rx="2" fill="#00f0ff" filter="url(#hglow2)">
  <animate attributeName="width" values="0;360" dur="2.5s" begin="0.3s" fill="freeze" calcMode="spline" keySplines=".3 0 .2 1" keyTimes="0;1"/>
  <animate attributeName="fill" values="#00f0ff;#ff2bd6;#f0ff00;#00f0ff" dur="3s" begin="0.3s" repeatCount="indefinite"/>
</rect>
<text x="450" y="262" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#ff2bd6" letter-spacing="3" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.1s" begin="2.8s" fill="freeze"/>
&gt;&gt;&gt; ACCESS GRANTED &lt;&lt;&lt;
</text>

</svg>
