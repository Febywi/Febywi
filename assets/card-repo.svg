<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 50" width="900" height="50" role="img" aria-label="Featured Repositories">
<defs>
<filter id="crg" x="-20%" y="-50%" width="140%" height="200%">
  <feGaussianBlur stdDeviation="2" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect width="900" height="50" fill="#0a0a0a"/>
<rect x="30" y="24" width="840" height="1" fill="#ff00ff" opacity=".15"/>
<rect x="810" y="24" width="60" height="1" fill="#ff00ff" opacity=".8" filter="url(#crg)">
  <animate attributeName="x" values="810;30" dur="3s" repeatCount="indefinite"/>
</rect>
<text x="450" y="30" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700" font-size="14" fill="#ff00ff" letter-spacing="6" filter="url(#crg)">⟨ PROJECTS /⟩</text>
</svg>
