<!-- Bottom tagline -->
<text x="450" y="175" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" fill="#ff00ff" letter-spacing="5" opacity=".7">&gt;&gt;&gt; HACK . BUILD . ANALYZE . REPEAT &lt;&lt;&lt;</text>

