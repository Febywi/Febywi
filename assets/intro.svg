<g opacity="0">
  <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.54;0.995" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
  <rect y="106" width="3" height="28" fill="#00f0ff" x="315">
    <animate attributeName="x" values="315;334.3;353.6;372.9;392.2;411.5;430.8;450.1;469.4;488.7;508;527.3;546.6;565.9;585;585;585;585;565.9;546.6;527.3;508;488.7;469.4;450.1;430.8;411.5;392.2;372.9;353.6;334.3;315" keyTimes="0;0.54;0.55;0.56;0.57;0.58;0.59;0.60;0.61;0.62;0.63;0.64;0.65;0.66;0.67;0.88;0.89;0.90;0.91;0.92;0.93;0.94;0.95;0.955;0.96;0.965;0.97;0.975;0.98;0.985;0.99;0.995" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
