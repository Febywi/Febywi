<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" role="img" aria-label="Hallo saya Feby Awie - Web Development, Data Scientist">
<defs>
<linearGradient id="ibg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="190">
  <stop offset="0" stop-color="#0a0a0a"><animate attributeName="stop-color" values="#0a0a0a;#0d001a;#0a0a0a" dur="12s" repeatCount="indefinite"/></stop>
  <stop offset=".4" stop-color="#0d0030"><animate attributeName="stop-color" values="#0d0030;#1a0044;#0d0030" dur="10s" repeatCount="indefinite"/></stop>
  <stop offset=".7" stop-color="#1a0044"><animate attributeName="stop-color" values="#1a0044;#2a0060;#1a0044" dur="14s" repeatCount="indefinite"/></stop>
  <stop offset="1" stop-color="#0a0a0a"/>
  <animateTransform attributeName="gradientTransform" type="rotate" values="0 450 95;8 450 95;0 450 95;-8 450 95;0 450 95" dur="18s" repeatCount="indefinite"/>
</linearGradient>
<pattern id="igrid" width="30" height="30" patternUnits="userSpaceOnUse">
  <path d="M30 0H0V30" fill="none" stroke="#00f0ff" stroke-opacity=".05"/>
</pattern>
<pattern id="iscan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="1" fill="#000" opacity=".2"/>
  <animateTransform attributeName="patternTransform" type="translate" values="0 0;0 4" dur="2.5s" repeatCount="indefinite"/>
</pattern>
<linearGradient id="iedge" x1="0" x2="1" y1="0" y2="0">
  <stop offset="0" stop-color="#ff00ff" stop-opacity="0"/>
  <stop offset=".3" stop-color="#00f0ff"/>
  <stop offset=".5" stop-color="#ff2bd6"/>
  <stop offset=".7" stop-color="#00f0ff"/>
  <stop offset="1" stop-color="#ff00ff" stop-opacity="0"/>
</linearGradient>
<filter id="iglow" x="-20%" y="-50%" width="140%" height="200%">
  <feGaussianBlur stdDeviation="3" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="iglow2" x="-20%" y="-50%" width="140%" height="200%">
  <feGaussianBlur stdDeviation="1.5" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>

<!-- Background -->
<rect width="900" height="190" fill="url(#ibg)"/>
<rect width="900" height="190" fill="url(#igrid)"/>
<rect width="900" height="190" fill="url(#iscan)"/>

<!-- Top/bottom edge lines -->
<rect y="0" width="900" height="2" fill="url(#iedge)" opacity=".6"/>
<rect y="188" width="900" height="2" fill="url(#iedge)" opacity=".6"/>

<!-- Running border - top -->
<rect y="0" width="80" height="2" fill="#ff00ff" opacity=".9" filter="url(#iglow2)">
  <animate attributeName="x" values="-80;900" dur="3.2s" repeatCount="indefinite"/>
</rect>
<!-- Running border - bottom -->
<rect y="188" width="80" height="2" fill="#00f0ff" opacity=".9" filter="url(#iglow2)">
  <animate attributeName="x" values="900;-80" dur="3.8s" repeatCount="indefinite"/>
</rect>

<!-- === LINE 1: "Hallo saya Feby Awie" - TYPE ONCE, PERMANENT === -->
<!-- Clip mask reveals text character by character -->
<clipPath id="ic1"><rect x="222" y="30" height="45" width="0">
  <animate attributeName="width" values="0;22.8;45.6;68.4;91.2;114;136.8;159.6;182.4;205.2;228;250.8;273.6;296.4;319.2;342;364.8;387.6;410.4;433.2;456" keyTimes="0;0.04762;0.09524;0.14286;0.19048;0.23810;0.28571;0.33333;0.38095;0.42857;0.47619;0.52381;0.57143;0.61905;0.66667;0.71429;0.76190;0.80952;0.85714;0.90476;0.95238" calcMode="discrete" dur="1.8s" begin="0.5s" fill="freeze"/>
</rect></clipPath>
<g clip-path="url(#ic1)">
  <text x="222" y="64" font-family="'Courier New',monospace" font-weight="800" font-size="30" fill="#ffffff" textLength="456" lengthAdjust="spacing" filter="url(#iglow2)">Hallo saya Feby Awie</text>
</g>

<!-- Typing cursor for line 1 -->
<rect y="38" width="3" height="30" fill="#00f0ff" opacity="0">
  <animate attributeName="opacity" values="1" dur="0.01s" begin="0.5s" fill="freeze"/>
  <animate attributeName="x" values="222;244.8;267.6;290.4;313.2;336;358.8;381.6;404.4;427.2;450;472.8;495.6;518.4;541.2;564;586.8;609.6;632.4;655.2;678" keyTimes="0;0.04762;0.09524;0.14286;0.19048;0.23810;0.28571;0.33333;0.38095;0.42857;0.47619;0.52381;0.57143;0.61905;0.66667;0.71429;0.76190;0.80952;0.85714;0.90476;0.95238" calcMode="discrete" dur="1.8s" begin="0.5s" fill="freeze"/>
</rect>
<!-- Blinking cursor after typing done -->
<rect y="38" width="3" height="30" fill="#00f0ff" opacity="0" x="678">
  <animate attributeName="opacity" values="1;0" keyTimes="0;.5" calcMode="discrete" dur="1s" begin="2.3s" repeatCount="indefinite"/>
</rect>

<!-- Waving hand emoji -->
<text x="690" y="66" font-size="30" opacity="0">👋
  <animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.3s" fill="freeze"/>
  <animateTransform attributeName="transform" type="rotate" values="0 705 56;20 705 56;-8 705 56;20 705 56;-5 705 56;15 705 56;0 705 56;0 705 56" keyTimes="0;.12;.24;.36;.48;.6;.72;1" dur="2s" begin="2.3s" repeatCount="indefinite"/>
</text>

<!-- Sparkle emojis -->
<text x="200" y="60" font-size="18" opacity="0">✨
  <animate attributeName="opacity" values="0;1;.2;1;0" keyTimes="0;.15;.5;.8;1" dur="2.6s" begin="2.3s" repeatCount="indefinite"/>
</text>
<text x="725" y="58" font-size="16" opacity="0">💜
  <animate attributeName="opacity" values="0;1;.3;1" keyTimes="0;.2;.6;1" dur="1.8s" begin="2.3s" repeatCount="indefinite"/>
</text>

<!-- === LINE 2: "Web Development" / "Data Scientist" - TYPE & DELETE LOOP === -->

<!-- "Web Development" - type then delete -->
<clipPath id="ira"><rect x="300" y="102" height="40" width="0">
  <animate attributeName="width" values="0;20;40;60;80;100;120;140;160;180;200;220;240;260;280;300;300;300;300;280;260;240;220;200;180;160;140;120;100;80;60;40;20;0" keyTimes="0;0.04;0.05;0.06;0.07;0.08;0.09;0.10;0.11;0.12;0.13;0.14;0.15;0.16;0.17;0.18;0.40;0.42;0.43;0.44;0.45;0.46;0.47;0.48;0.49;0.50;0.51;0.52;0.53;0.54;0.55;0.56;0.57;0.58" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
</rect></clipPath>
<g clip-path="url(#ira)">
  <text x="300" y="130" font-family="'Courier New',monospace" font-weight="700" font-size="26" fill="#00f0ff" textLength="300" lengthAdjust="spacing" filter="url(#iglow2)">Web Development</text>
</g>

<!-- Cursor for "Web Development" -->
<g opacity="0">
  <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.04;0.58" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
  <rect y="106" width="3" height="28" fill="#ff2bd6" x="300">
    <animate attributeName="x" values="300;320;340;360;380;400;420;440;460;480;500;520;540;560;580;600;600;600;600;580;560;540;520;500;480;460;440;420;400;380;360;340;320;300" keyTimes="0;0.04;0.05;0.06;0.07;0.08;0.09;0.10;0.11;0.12;0.13;0.14;0.15;0.16;0.17;0.18;0.40;0.42;0.43;0.44;0.45;0.46;0.47;0.48;0.49;0.50;0.51;0.52;0.53;0.54;0.55;0.56;0.57;0.58" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
  </rect>
