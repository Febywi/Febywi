<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" role="img" aria-label="Hello I'm Feby Awie - Web Development, Data Scientist">
<defs>
<linearGradient id="ibg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="190">
  <stop offset="0" stop-color="#0a0a0a"><animate attributeName="stop-color" values="#0a0a0a;#0d001a;#0a0a0a" dur="12s" repeatCount="indefinite"/></stop>
  <stop offset=".4" stop-color="#0d0030"><animate attributeName="stop-color" values="#0d0030;#1a0044;#0d0030" dur="10s" repeatCount="indefinite"/></stop>
  <stop offset=".7" stop-color="#1a0044"><animate attributeName="stop-color" values="#1a0044;#2a0060;#1a0044" dur="14s" repeatCount="indefinite"/></stop>
  <stop offset="1" stop-color="#0a0a0a"/>
  <animateTransform attributeName="gradientTransform" type="rotate" values="0 450 95;8 450 95;0 450 95;-8 450 95;0 450 95" dur="18s" repeatCount="indefinite"/>
</linearGradient>
<pattern id="igrid" width="30" height="30" patternUnits="userSpaceOnUse">
  <path d="M30 0H0V30" fill="none" stroke="#00f0ff" stroke-opacity=".05"/>
</pattern>
<pattern id="iscan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="1" fill="#000" opacity=".2"/>
  <animateTransform attributeName="patternTransform" type="translate" values="0 0;0 4" dur="2.5s" repeatCount="indefinite"/>
</pattern>
<linearGradient id="iedge" x1="0" x2="1" y1="0" y2="0">
  <stop offset="0" stop-color="#ff00ff" stop-opacity="0"/>
  <stop offset=".3" stop-color="#00f0ff"/>
  <stop offset=".5" stop-color="#ff2bd6"/>
  <stop offset=".7" stop-color="#00f0ff"/>
  <stop offset="1" stop-color="#ff00ff" stop-opacity="0"/>
</linearGradient>
<filter id="iglow" x="-20%" y="-50%" width="140%" height="200%">
  <feGaussianBlur stdDeviation="3" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="iglow2" x="-20%" y="-50%" width="140%" height="200%">
  <feGaussianBlur stdDeviation="1.5" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>

<!-- Background -->
<rect width="900" height="190" fill="url(#ibg)"/>
<rect width="900" height="190" fill="url(#igrid)"/>
<rect width="900" height="190" fill="url(#iscan)"/>

<!-- ============ MATRIX RAIN - Falling code ============ -->
<g font-family="'Courier New',monospace" font-size="10" opacity=".18">
  <text x="20" fill="#00f0ff"><animate attributeName="y" values="-10;200" dur="3.5s" begin="0.1s" repeatCount="indefinite"/>var</text>
  <text x="20" fill="#00f0ff"><animate attributeName="y" values="-10;200" dur="3.5s" begin="1.85s" repeatCount="indefinite"/>let</text>
  <text x="65" fill="#ff2bd6"><animate attributeName="y" values="-15;200" dur="4.2s" begin="0.4s" repeatCount="indefinite"/>func</text>
  <text x="65" fill="#ff2bd6"><animate attributeName="y" values="-15;200" dur="4.2s" begin="2.5s" repeatCount="indefinite"/>call</text>
  <text x="115" fill="#00f0ff"><animate attributeName="y" values="-12;200" dur="3.0s" begin="0.8s" repeatCount="indefinite"/>0xA1</text>
  <text x="115" fill="#00f0ff"><animate attributeName="y" values="-12;200" dur="3.0s" begin="2.0s" repeatCount="indefinite"/>0xF7</text>
  <text x="165" fill="#f0ff00"><animate attributeName="y" values="-18;200" dur="4.8s" begin="1.3s" repeatCount="indefinite"/>sudo</text>
  <text x="215" fill="#ff00ff"><animate attributeName="y" values="-8;200" dur="3.3s" begin="0.5s" repeatCount="indefinite"/>init</text>
  <text x="215" fill="#ff00ff"><animate attributeName="y" values="-8;200" dur="3.3s" begin="2.2s" repeatCount="indefinite"/>boot</text>
  <text x="265" fill="#00f0ff"><animate attributeName="y" values="-14;200" dur="4.5s" begin="1.0s" repeatCount="indefinite"/>npm</text>
  <text x="315" fill="#ff2bd6"><animate attributeName="y" values="-20;200" dur="3.7s" begin="0.3s" repeatCount="indefinite"/>curl</text>
  <text x="315" fill="#ff2bd6"><animate attributeName="y" values="-20;200" dur="3.7s" begin="2.0s" repeatCount="indefinite"/>wget</text>
  <text x="365" fill="#00f0ff"><animate attributeName="y" values="-10;200" dur="3.1s" begin="1.6s" repeatCount="indefinite"/>ssh@</text>
  <text x="420" fill="#f0ff00"><animate attributeName="y" values="-16;200" dur="4.3s" begin="0.7s" repeatCount="indefinite"/>class</text>
  <text x="470" fill="#ff00ff"><animate attributeName="y" values="-12;200" dur="3.4s" begin="0.2s" repeatCount="indefinite"/>exec</text>
  <text x="470" fill="#ff00ff"><animate attributeName="y" values="-12;200" dur="3.4s" begin="1.9s" repeatCount="indefinite"/>kill</text>
  <text x="520" fill="#00f0ff"><animate attributeName="y" values="-18;200" dur="4.0s" begin="1.2s" repeatCount="indefinite"/>grep</text>
  <text x="575" fill="#ff2bd6"><animate attributeName="y" values="-8;200" dur="3.6s" begin="0.6s" repeatCount="indefinite"/>bash</text>
  <text x="575" fill="#ff2bd6"><animate attributeName="y" values="-8;200" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>zsh</text>
  <text x="625" fill="#00f0ff"><animate attributeName="y" values="-14;200" dur="4.7s" begin="1.5s" repeatCount="indefinite"/>pip3</text>
  <text x="680" fill="#f0ff00"><animate attributeName="y" values="-20;200" dur="3.2s" begin="0.9s" repeatCount="indefinite"/>git</text>
  <text x="680" fill="#f0ff00"><animate attributeName="y" values="-20;200" dur="3.2s" begin="2.1s" repeatCount="indefinite"/>pull</text>
  <text x="730" fill="#ff00ff"><animate attributeName="y" values="-10;200" dur="4.1s" begin="0.4s" repeatCount="indefinite"/>def()</text>
  <text x="785" fill="#00f0ff"><animate attributeName="y" values="-16;200" dur="3.8s" begin="1.8s" repeatCount="indefinite"/>cat</text>
  <text x="785" fill="#00f0ff"><animate attributeName="y" values="-16;200" dur="3.8s" begin="0.3s" repeatCount="indefinite"/>echo</text>
  <text x="840" fill="#ff2bd6"><animate attributeName="y" values="-12;200" dur="4.4s" begin="1.1s" repeatCount="indefinite"/>awk</text>
  <text x="870" fill="#00f0ff"><animate attributeName="y" values="-18;200" dur="3.5s" begin="0.7s" repeatCount="indefinite"/>sed</text>
</g>

<!-- ============ TYPING CODE in background ============ -->
<g font-family="'Courier New',monospace" font-size="9" opacity=".1">
  <text x="20" y="25" fill="#00f0ff">
    <animate attributeName="opacity" values="0;0;.12;.12;.12;0" keyTimes="0;.05;.1;.6;.9;1" dur="8s" repeatCount="indefinite"/>
    $ nmap -sV 10.0.0.1 --script vuln</text>
  <text x="500" y="20" fill="#ff2bd6">
    <animate attributeName="opacity" values="0;0;.1;.1;.1;0" keyTimes="0;.3;.35;.7;.9;1" dur="10s" repeatCount="indefinite"/>
    import torch; model = GPT(config)</text>
  <text x="30" y="170" fill="#f0ff00">
    <animate attributeName="opacity" values="0;0;.12;.12;.12;0" keyTimes="0;.15;.2;.55;.85;1" dur="9s" repeatCount="indefinite"/>
    php artisan migrate --seed</text>
  <text x="500" y="175" fill="#ff00ff">
    <animate attributeName="opacity" values="0;0;.1;.1;.1;0" keyTimes="0;.4;.45;.75;.9;1" dur="11s" repeatCount="indefinite"/>
    docker run -d -p 443:443 nginx</text>
  <text x="250" y="95" fill="#00f0ff">
    <animate attributeName="opacity" values="0;0;.12;.12;.12;0" keyTimes="0;.5;.55;.8;.95;1" dur="12s" repeatCount="indefinite"/>
    git commit -m "feat: neural network"</text>
  <text x="600" y="145" fill="#ff2bd6">
    <animate attributeName="opacity" values="0;0;.1;.1;.1;0" keyTimes="0;.2;.25;.65;.85;1" dur="7s" repeatCount="indefinite"/>
    SELECT * FROM sessions WHERE active=1;</text>
</g>

<!-- Top/bottom edge lines -->
<rect y="0" width="900" height="2" fill="url(#iedge)" opacity=".6"/>
<rect y="188" width="900" height="2" fill="url(#iedge)" opacity=".6"/>

<!-- Running border - top -->
<rect y="0" width="80" height="2" fill="#ff00ff" opacity=".9" filter="url(#iglow2)">
  <animate attributeName="x" values="-80;900" dur="3.2s" repeatCount="indefinite"/>
</rect>
<!-- Running border - bottom -->
<rect y="188" width="80" height="2" fill="#00f0ff" opacity=".9" filter="url(#iglow2)">
  <animate attributeName="x" values="900;-80" dur="3.8s" repeatCount="indefinite"/>
</rect>

<!-- === LINE 1: "Hello I'm Feby Awie" - TYPE ONCE, PERMANENT === -->
<!-- Clip mask reveals text character by character -->
<clipPath id="ic1"><rect x="210" y="30" height="45" width="0">
  <animate attributeName="width" values="0;24;48;72;96;120;144;168;192;216;240;264;288;312;336;360;384;408;432;456;480" keyTimes="0;0.04762;0.09524;0.14286;0.19048;0.23810;0.28571;0.33333;0.38095;0.42857;0.47619;0.52381;0.57143;0.61905;0.66667;0.71429;0.76190;0.80952;0.85714;0.90476;0.95238" calcMode="discrete" dur="1.8s" begin="0.5s" fill="freeze"/>
</rect></clipPath>
<g clip-path="url(#ic1)">
  <text x="210" y="64" font-family="'Courier New',monospace" font-weight="800" font-size="30" fill="#ffffff" textLength="480" lengthAdjust="spacing" filter="url(#iglow2)">Hello I'm Feby Awie</text>
</g>

<!-- Typing cursor for line 1 -->
<rect y="38" width="3" height="30" fill="#00f0ff" opacity="0">
  <animate attributeName="opacity" values="1" dur="0.01s" begin="0.5s" fill="freeze"/>
  <animate attributeName="x" values="210;234;258;282;306;330;354;378;402;426;450;474;498;522;546;570;594;618;642;666;690" keyTimes="0;0.04762;0.09524;0.14286;0.19048;0.23810;0.28571;0.33333;0.38095;0.42857;0.47619;0.52381;0.57143;0.61905;0.66667;0.71429;0.76190;0.80952;0.85714;0.90476;0.95238" calcMode="discrete" dur="1.8s" begin="0.5s" fill="freeze"/>
</rect>
<!-- Blinking cursor after typing done -->
<rect y="38" width="3" height="30" fill="#00f0ff" opacity="0" x="690">
  <animate attributeName="opacity" values="1;0" keyTimes="0;.5" calcMode="discrete" dur="1s" begin="2.3s" repeatCount="indefinite"/>
</rect>

<!-- Waving hand emoji -->
<text x="700" y="66" font-size="30" opacity="0">👋
  <animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.3s" fill="freeze"/>
  <animateTransform attributeName="transform" type="rotate" values="0 715 56;20 715 56;-8 715 56;20 715 56;-5 715 56;15 715 56;0 715 56;0 715 56" keyTimes="0;.12;.24;.36;.48;.6;.72;1" dur="2s" begin="2.3s" repeatCount="indefinite"/>
</text>

<!-- === LINE 2: "Web Development" / "Data Scientist" - TYPE &amp; DELETE LOOP === -->

