name: generate pacman + stars

on:
  schedule:
    - cron: '0 0 * * *'     # jalan otomatis tiap hari jam 00:00 UTC
  workflow_dispatch:         # bisa dijalanin manual dari tab Actions
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate pacman contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      - name: hitung total stars (buat badge README)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          STARS=$(gh api --paginate "users/${{ github.repository_owner }}/repos?per_page=100&type=owner" --jq '.[].stargazers_count' | awk '{s+=$1} END {print s+0}')
          echo "{\"schemaVersion\":1,\"label\":\"Total Stars\",\"message\":\"$STARS\",\"color\":\"9d4edd\",\"namedLogo\":\"github\",\"logoColor\":\"c77dff\"}" > dist/stars.json
          cat dist/stars.json

      - name: push hasil ke branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
